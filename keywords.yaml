- category: Fees
  terms: ["\\bfees?\\b", "fast track", "\\$\\s?\\d", "\\bAUD\\b", "charges?\\b"]
  urgency: Critical
  action: "Update pricing figures on all pages that show EA fees."
  page_types: ["Pricing", "MSA guide"]

