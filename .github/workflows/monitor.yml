name: monitor

on:
  schedule:
    # GitHub often starts on-the-hour crons late or drops them under load, so use
    # off-peak minutes plus two backups. The guard job lets only the first
    # successful scheduled run per Nepal calendar day do the work.
    - cron: "17 22 * * *" # 04:02 Nepal time (primary)
    - cron: "43 0 * * *" # 06:28 Nepal time (backup)
    - cron: "23 3 * * *" # 09:08 Nepal time (backup)
  workflow_dispatch:
    inputs:
      digest:
        description: Also post the weekly digest (ignored when the daily summary is on)
        type: boolean
        default: false
      daily_summary:
        description: Post the daily check-in message
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cdr-watch
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if a scheduled run already succeeded today (Nepal time)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Kathmandu date +%F)
          done_today=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/monitor.yml/runs?event=schedule&status=success&per_page=20" \
            --jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | (.run_started_at | fromdateiso8601 + 20700 | strftime(\"%Y-%m-%d\"))
                   | select(. == \"$today\")] | length")
          echo "scheduled runs already successful on $today (Nepal): $done_today"
          if [ "$done_today" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  monitor:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check state branch
        id: state
        run: |
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.state.outputs.exists == 'true'
        with:
          ref: state
          path: state

      - name: Create orphan state branch (first run)
        if: steps.state.outputs.exists != 'true'
        run: |
          git init -b state state
          git -C state remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run CDR Watch
        id: run
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_FLAG: ${{ inputs.digest && '--digest' || '' }}
          DAILY_FLAG: ${{ (github.event_name == 'schedule' || inputs.daily_summary) && '--daily-summary' || '' }}
        run: |
          set +e
          python -m cdrwatch.run --state-dir state $DIGEST_FLAG $DAILY_FLAG | tee run.log
          code=${PIPESTATUS[0]}
          if grep -q "^SLACK DELIVERY FAILED" run.log; then
            echo "slack_failed=true" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      - name: Commit state
        # Still commit when the only failure was Slack delivery (state is saved);
        # a crash skips the commit so the next run retries.
        if: success() || steps.run.outputs.slack_failed == 'true'
        working-directory: state
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -q -m "chore(state): run $(date -u +%F)"
          if ! git push origin HEAD:state; then
            git pull --rebase origin state
            git push origin HEAD:state
          fi

      - name: Keepalive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
