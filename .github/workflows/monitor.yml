name: monitor

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: Also post the weekly digest
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: cdr-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check state branch
        id: state
        run: |
          if git ls-remote --exit-code --heads origin state > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.state.outputs.exists == 'true'
        with:
          ref: state
          path: state

      - name: Create orphan state branch (first run)
        if: steps.state.outputs.exists != 'true'
        run: |
          git init -b state state
          git -C state remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run CDR Watch
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_FLAG: ${{ inputs.digest && '--digest' || '' }}
        run: python -m cdrwatch.run --state-dir state $DIGEST_FLAG

      - name: Commit state
        working-directory: state
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -q -m "chore(state): run $(date -u +%F)"
          if ! git push origin HEAD:state; then
            git pull --rebase origin state
            git push origin HEAD:state
          fi

      - name: Keepalive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
